name: CI and deployment

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VP_GIT_HOOKS: "0"
  VARLOCK_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Lint
        run: vp run lint
      - name: Build
        run: vp run -r build
      - name: Type check
        run: vp run -r typecheck
      - name: Unit tests
        run: vp run --filter '*' test --exclude '**/env.test.ts'
      - name: Ingest end-to-end tests (MySQL Testcontainers)
        run: vp run poe-boats#test:e2e

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Build
        run: vp run -r build
      - name: Browser end-to-end tests
        timeout-minutes: 15
        run: vp run poe-boats#test:e2e:browser --reporter=line
      - name: Upload browser failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: apps/poe.boats/test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both validation jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success

  deploy:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://poe.boats' || 'https://dev.poe.boats' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      APP_ENV: test
      CLOUDFLARE_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      URL: ${{ github.ref_name == 'main' && 'poe.boats' || 'dev.poe.boats' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Build
        run: vp run poe-boats#build
      - name: Deploy code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec --filter poe-boats wrangler deploy --env "${CLOUDFLARE_ENV}" --keep-vars
