name: CI and deployment

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VP_GIT_HOOKS: "0"
  VARLOCK_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Lint
        run: vp run lint
      - name: Build
        run: vp run -r build
      - name: Type check
        run: vp run -r typecheck
      - name: Ingest end-to-end tests (MySQL Testcontainers)
        run: vp run poe-boats#test:e2e

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Prepare unit test dependencies
        run: |
          vp run --filter './packages/*' build
          vp run poe-boats#test:prepare
      - name: Unit tests
        run: vp run poe-boats#test --exclude '**/env.test.ts' --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=unit-results.json
      - name: Upload unit timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-results-${{ matrix.shard }}
          path: apps/poe.boats/unit-results.json
          if-no-files-found: ignore
          retention-days: 7

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run --filter './packages/*' build
      - name: Workspace package tests
        run: vp run --filter './packages/*' test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    env:
      APP_ENV: test
      PLAYWRIGHT_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Build
        run: vp run -r build
      - name: Browser end-to-end tests
        timeout-minutes: 15
        run: vp run poe-boats#test:e2e:browser --shard=${{ matrix.shard }}/2 --reporter=line,blob
      - name: Upload browser failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: apps/poe.boats/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report-${{ matrix.shard }}
          path: apps/poe.boats/blob-report/
          if-no-files-found: ignore
          retention-days: 7

  browser-report:
    if: ${{ !cancelled() }}
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-report-*
          path: apps/poe.boats/all-blob-reports
          merge-multiple: true
      - name: Merge browser reports
        run: vp exec --filter poe-boats playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload combined browser report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report
          path: apps/poe.boats/playwright-report/
          retention-days: 7

  validate:
    if: always()
    needs: [checks, unit, packages, browser, browser-report]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          REPORT_RESULT: ${{ needs.browser-report.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$PACKAGES_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$REPORT_RESULT" = success

  deploy:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://poe.boats' || 'https://dev.poe.boats' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      APP_ENV: test
      CLOUDFLARE_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      URL: ${{ github.ref_name == 'main' && 'poe.boats' || 'dev.poe.boats' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Build
        run: vp run poe-boats#build
      - name: Deploy code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec --filter poe-boats wrangler deploy --env "${CLOUDFLARE_ENV}" --keep-vars
