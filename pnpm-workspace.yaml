packages:
  - packages/*
  - apps/*
allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  workerd: true

catalog:
  "@base-ui/react": ^1.4.1
  "@biomejs/biome": 2.4.8
  "@fontsource-variable/geist": ^5.2.8
  "@tailwindcss/typography": ^0.5.19
  '@testcontainers/mysql': ^12.2.0
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2
  "@types/node": ^24.12.2
  '@varlock/1password-plugin': ^2.0.4
  '@varlock/cloudflare-integration': ^1.6.0
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cross-env: ^10.1.0
  drizzle-kit: 1.0.0-beta.21
  drizzle-orm: 1.0.0-beta.21
  i18next: ^26.0.7
  i18next-browser-languagedetector: ^8.2.1
  i18next-resources-to-backend: ^1.2.1
  jsdom: ^29.0.2
  ky: ^2.0.2
  linkedom: ^0.18.12
  marked: ^18.0.2
  mysql2: ^3.24.5
  nanoid: ^5.1.9
  next-themes: ^0.4.6
  pino: ^10.3.1
  portless: ^0.12.0
  react-i18next: ^17.0.4
  react-markdown: ^10.1.0
  remix-themes: ^2.0.4
  shadcn: ^4.4.0
  simple-icons: ^16.17.0
  sonner: ^2.0.7
  typescript: ^5.9.3
  varlock: ^1.21.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  wrangler: ^4.84.1

catalogMode: prefer
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
