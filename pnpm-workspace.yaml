packages:
  - apps/*
  - packages/*

catalog:
  "@base-ui/react": ^1.3.0
  "@biomejs/biome": 2.4.8
  "@fontsource-variable/geist": ^5.2.8
  "@types/node": ^24
  class-variance-authority: ^0.7.1
  shadcn: ^4.1.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.1.13
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  wrangler: ^4.76.0

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
