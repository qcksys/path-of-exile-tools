name: poe-ingest-dev

x-worker: &worker
  image: ${INGEST_IMAGE:?Set INGEST_IMAGE to the deployment digest}
  init: true
  restart: unless-stopped
  stop_grace_period: 2m
  mem_limit: 2g
  healthcheck:
    test: [CMD, node, src/container-health.ts]
    interval: 30s
    timeout: 5s
    start_period: 5m
    retries: 3
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  pc:
    <<: *worker
    # The main thread, four DuckDB threads and three classification threads run together while a
    # page's SQL runs; with fewer cores the CPU quota throttles them all and pages slow down.
    cpus: 8.0
    # The PC database is large; enough memory lets DuckDB checkpoint by WAL size, not per page.
    # Index memory is not bounded by PS_MEMORY_LIMIT, hence the headroom above it, and the worker
    # also holds every listing's key and market in memory (a few GB in a busy league).
    mem_limit: 20g
    env_file: ./config/pc.env
    environment:
      PS_ARCHIVE_DIR: /backups
      # Keeps only the day the worker still needs behind its stream position, so its tables and
      # their indexes stop growing with the league however far behind it falls.
      PS_ARCHIVE_KEEP_HOURS: "26"
      PS_RAW_ARCHIVE_DIR: /backups/raw
      # pc-capture fetches the stream; this worker reads the archive and can fall behind safely.
      PS_SEPARATE_CAPTURE: "true"
      # A cycle's checkpoint and deliveries take about as long whatever its size, so longer cycles
      # spend less of each hour on them. The site's figures update once a cycle.
      INGEST_PAGES: "200"
      # DuckDB keeps cached blocks up to this, and writing a batch adds a few GB on top of it.
      PS_MEMORY_LIMIT: 8GB
      PS_THREADS: "4"
      # Classifies each page's equipment while its listings and sales are written.
      PS_CLASSIFY_THREADS: "3"
      # One transaction per cycle (cut at each hour): listings are found in memory and written once.
      PS_BATCH_PAGES: "200"
      # DuckDB estimates a 200-page batch above 1GB, so a lower threshold checkpoints at every
      # commit. Above it, commits append to the WAL and the worker checkpoints once DuckDB holds a
      # quarter of its memory limit in committed updates.
      PS_CHECKPOINT_THRESHOLD: 4GB
      # Each reclassified hour re-delivers 24 hours of cohort rows; this keeps the pre-#76 pace.
      PS_RECLASSIFY_PAGES_PER_HOUR: "120"
      # Sending each delivered hour's sale changes every cycle had the receiver recompute the same
      # item days over and over while the worker waited.
      PS_REDELIVER_MINUTES: "30"
    volumes:
      - ./data/pc:/data
      - ./backups/pc:/backups
    secrets:
      - source: pc_client_secret
        target: poe_client_secret
      - source: pc_ingest_token
        target: poe_boats_ingest_token
      - source: pc_b2_application_key
        target: b2_application_key
  # The one step that cannot be rebuilt: it needs no database, so nothing downstream can stop it.
  pc-capture:
    <<: *worker
    command: [capture]
    # On one thread, sealing a league-start hour took longer than the hour. Eight zstd threads
    # use about eight cores and 1.5 GB while an hour seals, beside fetching.
    cpus: 9.0
    mem_limit: 4g
    env_file: ./config/pc.env
    environment:
      PS_RAW_ARCHIVE_DIR: /backups/raw
      INGEST_STATUS_FILE: /backups/raw/capture-status.json
      PS_RAW_SEAL_THREADS: "8"
    volumes:
      - ./backups/pc:/backups
    secrets:
      - source: pc_client_secret
        target: poe_client_secret
      - source: pc_ingest_token
        target: poe_boats_ingest_token
      - source: pc_b2_application_key
        target: b2_application_key
  poe2:
    <<: *worker
    cpus: 1.0
    env_file: ./config/poe2.env
    environment:
      PS_ARCHIVE_DIR: /backups
      # PoE 2 has no stash stream; this keeps its exchange digests.
      PS_RAW_ARCHIVE_DIR: /backups/raw
    volumes:
      - ./data/poe2:/data
      - ./backups/poe2:/backups
    secrets:
      - source: poe2_client_secret
        target: poe_client_secret
      - source: poe2_ingest_token
        target: poe_boats_ingest_token
      # One key per environment's bucket; B2_PREFIX in poe2.env keeps the realms apart.
      - source: pc_b2_application_key
        target: b2_application_key
  # The dev receiver's database. Its Worker reaches it through Hyperdrive and mysql-tunnel.
  mysql:
    image: mysql:8.4
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 2m
    mem_limit: 6g
    command:
      # The market rows can be delivered again from the workers' archives, so this trades the last
      # second of commits on a host crash, and point-in-time recovery, for write speed.
      - --skip-log-bin
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-buffer-pool-size=4G
      - --innodb-redo-log-capacity=2G
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: poeboats
      MYSQL_USER: poeboats
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_poeboats_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    # For maintenance from the host; nothing else connects except through the tunnel.
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./data/mysql:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_poeboats_password
    healthcheck:
      test: [CMD, mysqladmin, ping, --host=127.0.0.1, --silent]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    logging: *logging
  # Routes the database hostname, which Cloudflare Access limits to the Hyperdrive and CI service
  # tokens, to mysql:3306.
  mysql-tunnel:
    image: cloudflare/cloudflared:2026.10.5
    user: "1000:1000"
    command: [tunnel, --no-autoupdate, run]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/mysql_tunnel_token
    secrets:
      - mysql_tunnel_token
    logging: *logging

secrets:
  pc_client_secret:
    file: ./secrets/pc_client_secret
  pc_ingest_token:
    file: ./secrets/pc_ingest_token
  pc_b2_application_key:
    file: ./secrets/pc_b2_application_key
  poe2_client_secret:
    file: ./secrets/poe2_client_secret
  poe2_ingest_token:
    file: ./secrets/poe2_ingest_token
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_poeboats_password:
    file: ./secrets/mysql_poeboats_password
  mysql_tunnel_token:
    file: ./secrets/mysql_tunnel_token
