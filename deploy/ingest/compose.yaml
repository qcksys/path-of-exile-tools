name: poe-ingest-dev

x-worker: &worker
  image: ${INGEST_IMAGE:?Set INGEST_IMAGE to the deployment digest}
  init: true
  restart: unless-stopped
  stop_grace_period: 2m
  mem_limit: 2g
  healthcheck:
    test: [CMD, node, src/container-health.ts]
    interval: 30s
    timeout: 5s
    start_period: 5m
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  pc:
    <<: *worker
    cpus: 2.0
    # The PC database is large; enough memory lets DuckDB checkpoint by WAL size, not per page.
    # Index memory is not bounded by PS_MEMORY_LIMIT, hence the headroom above it.
    mem_limit: 16g
    env_file: ./config/pc.env
    environment:
      PS_ARCHIVE_DIR: /backups
      PS_RAW_ARCHIVE_DIR: /backups/raw
      PS_MEMORY_LIMIT: 10GB
      PS_CHECKPOINT_THRESHOLD: 1GB
      # Each reclassified hour re-delivers 24 hours of cohort rows; this keeps the pre-#76 pace.
      PS_RECLASSIFY_PAGES_PER_HOUR: "120"
    volumes:
      - ./data/pc:/data
      - ./backups/pc:/backups
    secrets:
      - source: pc_client_secret
        target: poe_client_secret
      - source: pc_ingest_token
        target: poe_boats_ingest_token
      - source: pc_b2_application_key
        target: b2_application_key
  poe2:
    <<: *worker
    cpus: 1.0
    env_file: ./config/poe2.env
    environment:
      PS_ARCHIVE_DIR: /backups
    volumes:
      - ./data/poe2:/data
      - ./backups/poe2:/backups
    secrets:
      - source: poe2_client_secret
        target: poe_client_secret
      - source: poe2_ingest_token
        target: poe_boats_ingest_token

secrets:
  pc_client_secret:
    file: ./secrets/pc_client_secret
  pc_ingest_token:
    file: ./secrets/pc_ingest_token
  pc_b2_application_key:
    file: ./secrets/pc_b2_application_key
  poe2_client_secret:
    file: ./secrets/poe2_client_secret
  poe2_ingest_token:
    file: ./secrets/poe2_ingest_token
